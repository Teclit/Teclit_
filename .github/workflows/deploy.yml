name: 🎯 Teclit CI/CD

on:
  push:
    branches: [develop, staging, master]
  pull_request:
    branches: [develop, staging, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # 1. Qualité : format, lint, typecheck, tests unitaires
  quality:
    name: ✅ Lint, typecheck & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint (0 warning)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitaires (Karma / ChromeHeadless)
        run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # 2. Build de production (pré-rendu)
  build:
    name: ⚙️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # 3. Tests e2e Playwright sur le build
  e2e:
    name: 🎭 Tests e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 4. Image Docker (push uniquement)
  docker-build-push:
    name: 🐳 Build & push de l'image Docker
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/teclit-angular-app
    steps:
      - uses: actions/checkout@v4
      - name: Tag selon la branche
        run: |
          case "${GITHUB_REF#refs/heads/}" in
            develop) echo "TAG=dev" >> $GITHUB_ENV ;;
            staging) echo "TAG=staging" >> $GITHUB_ENV ;;
            master) echo "TAG=prod" >> $GITHUB_ENV ;;
            *) echo "Branche inconnue." && exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 5. Déploiement Vercel (production, branche master)
  deploy:
    name: 🚀 Déploiement Vercel (production)
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Vérification des secrets Vercel
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant (Settings > Secrets and variables > Actions)"; exit 1; fi
          done
      - run: npm install --global vercel@latest
      - name: Récupération de la config du projet Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Déploiement
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
