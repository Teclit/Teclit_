name: 🎯 Teclit CI/CD

on:
  push:
    branches: [develop, staging, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # 1. Qualité : format, lint, typecheck, tests unitaires (Angular + serveur)
  quality:
    name: ✅ Lint, typecheck & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint (0 warning)
        run: npm run lint
      - name: Typecheck (app, specs, serveur, api)
        run: npm run typecheck
      - name: Tests unitaires (Vitest)
        run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # 2. Build de production (SSR + pré-rendu, budgets bloquants)
  build:
    name: ⚙️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # 3. Tests e2e Playwright sur le serveur SSR
  e2e:
    name: 🎭 Tests e2e (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 4. Lighthouse CI (à chaque PR et push)
  lighthouse:
    name: 🔦 Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Lighthouse CI (seuils dans lighthouserc.json)
        run: npx -y @lhci/cli@0.16.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14

  # 5. Image Docker : build à chaque PR, push sur les branches
  docker:
    name: 🐳 Image Docker
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/teclit-angular-app
      PUSH: ${{ github.event_name == 'push' && secrets.DOCKER_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag selon la branche
        run: |
          case "${GITHUB_REF#refs/heads/}" in
            develop) echo "TAG=dev" >> $GITHUB_ENV ;;
            staging) echo "TAG=staging" >> $GITHUB_ENV ;;
            master) echo "TAG=prod" >> $GITHUB_ENV ;;
            *) echo "TAG=pr" >> $GITHUB_ENV ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          build-args: SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME || 'teclit' }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME || 'teclit' }}:${{ github.sha }}

  # 6. Déploiement Vercel (production, branche master)
  deploy:
    name: 🚀 Déploiement Vercel (production)
    needs: [docker, lighthouse]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Vérification des secrets Vercel
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant (Settings > Secrets and variables > Actions)"; exit 1; fi
          done
      - run: npm install --global vercel@latest
      - name: Récupération de la config du projet Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Déploiement
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
