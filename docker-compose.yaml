services:
  # Développement : serveur Angular avec rechargement à chaud — http://localhost:4200
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '4200:4200'
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  # Production : build pré-rendu servi par Nginx non-root — http://localhost
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: teclit-portfolio:latest
    ports:
      - '80:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Tests unitaires (Chrome headless requis dans l'image ; à défaut, lancer `npm run test:ci` en local)
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run test:ci
    volumes:
      - ./:/app
      - /app/node_modules
    profiles: ['test']
