# Nom explicite : celui dérivé du dossier (« teclit_ ») donne un nom d'image invalide (« teclit_-dev »).
name: mon-portfolio

services:
  # Développement : serveur Angular avec rechargement à chaud — http://localhost:4200
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '4200:4200'
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  # Production : serveur SSR Node (Express) non-root — http://localhost:4000
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: teclit-portfolio:latest
    ports:
      - '4000:4000'
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
