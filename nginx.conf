server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fichiers hachés par Angular : cache long et immuable
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # L'API de contact est une fonction serverless (Vercel) : indisponible dans cette image.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"API de contact non disponible sur cet hébergement."}';
    }

    # Pages pré-rendues (/, /cv, /projets/<slug>), sinon rendu client (404 applicative)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.csr.html;
    }
}
