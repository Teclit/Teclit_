<footer class="footer">
  <div class="container footer__inner">
    <div>
      <p class="footer__name">{{ identity.fullName }}</p>
      <p class="muted">Développeur Full Stack · {{ identity.location }}</p>
      <p class="muted footer__copy">&copy; {{ startingYear }} – {{ year }} {{ identity.fullName }}</p>
    </div>

    <nav aria-label="Navigation de pied de page">
      <ul class="footer__links" role="list">
        @for (link of links; track link.fragment) {
          <li>
            <a routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
          </li>
        }
        <li><a routerLink="/cv">CV</a></li>
      </ul>
    </nav>

    <ul class="footer__social" role="list">
      <li>
        <a class="icon-btn" [href]="identity.links.github" target="_blank" rel="noopener noreferrer">
          <app-icon name="github" /><span class="sr-only">GitHub (nouvel onglet)</span>
        </a>
      </li>
      <li>
        <a class="icon-btn" [href]="identity.links.linkedin" target="_blank" rel="noopener noreferrer">
          <app-icon name="linkedin" /><span class="sr-only">LinkedIn (nouvel onglet)</span>
        </a>
      </li>
      <li>
        <a class="icon-btn" [href]="'mailto:' + identity.links.email">
          <app-icon name="mail" /><span class="sr-only">Envoyer un email</span>
        </a>
      </li>
    </ul>
  </div>
</footer>
