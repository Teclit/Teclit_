<header class="header">
  <div class="container header__inner">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand__mark" aria-hidden="true">TT</span>
      <span class="brand__name">{{ brand }}</span>
      <span class="sr-only">— accueil</span>
    </a>

    <nav class="nav" aria-label="Navigation principale">
      <ul id="menu-principal" class="nav__list" role="list" [class.nav__list--open]="menuOpen()">
        @for (link of links; track link.fragment) {
          <li>
            <a class="nav__link" routerLink="/" [fragment]="link.fragment" (click)="closeMenu()">{{ link.label }}</a>
          </li>
        }
        <li>
          <a class="nav__link nav__link--cv" routerLink="/cv" routerLinkActive="is-active" (click)="closeMenu()">
            <app-icon name="download" [size]="16" /> CV
          </a>
        </li>
      </ul>
    </nav>

    <div class="header__actions">
      <button
        type="button"
        class="icon-btn theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-pressed]="theme.theme() === 'dark'"
      >
        <span class="sr-only">Thème sombre</span>
        <app-icon class="theme-toggle__sun" name="sun" />
        <app-icon class="theme-toggle__moon" name="moon" />
      </button>
      <button
        type="button"
        class="icon-btn burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="menu-principal"
      >
        <span class="sr-only">Menu</span>
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      </button>
    </div>
  </div>
</header>
