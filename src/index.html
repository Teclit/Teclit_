<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Teklit TEWOLDE — Développeur Full Stack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Développeur Full Stack Java / Kotlin, Spring Boot, Node.js et Next.js. Découvrez mes projets, compétences et expériences."
    />
    <meta name="author" content="Teklit TEWOLDE" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      @font-face en ligne, et non dans styles.css : le CSS critique inliné au build (Beasties)
      ne reprend pas les @font-face et la feuille complète est chargée en différé. Sans ceci, le
      premier rendu se fait en police système, puis tout se réagence à l'arrivée de la feuille
      (CLS ~0,2 mesuré sous Linux sur /projets/:slug).
    -->
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin-ext-wght-normal.woff2') format('woff2-variations');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Repli aux métriques ajustées sur Inter. Arial est absente sous Linux : Liberation Sans
         et Arimo ont les mêmes métriques, donc les mêmes overrides. */
      @font-face {
        font-family: 'Inter Fallback';
        src:
          local('Arial'), local('ArialMT'), local('Liberation Sans'), local('LiberationSans-Regular'), local('Arimo');
        ascent-override: 90.44%;
        descent-override: 22.52%;
        line-gap-override: 0%;
        size-adjust: 107.12%;
      }
    </style>
    <script>
      // Thème appliqué avant le premier rendu : pas de flash clair/sombre.
      (function () {
        var d = document.documentElement;
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          d.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          d.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
